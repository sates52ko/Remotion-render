# Worker Registry Ref: 1788361261771
name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Kitap / Proje Slug'
        required: true
        default: 'single-dad-dilemma'
      composition:
        description: 'Composition ID'
        required: false
        default: ''
      chunk_size:
        description: 'Chunk boyutu'
        required: false
        default: '400'
      concurrency:
        description: 'Concurrency'
        required: false
        default: '2'
      frames:
        description: 'Frame aralığı (örn 0-32921) — boşsa tüm video. Uzun videoyu 6s job limiti altında tutmak için segment render.'
        required: false
        default: ''
      seg:
        description: 'Segment etiketi (örn 1). Verilirse çıktı <slug>-seg<seg>.mp4 olarak adlandırılır ve ayrı artifact yüklenir.'
        required: false
        default: ''
      skip_narrative_firewall:
        description: 'Emergency escape hatch — skip narrative-visual firewall (use for new books without registered vocabulary)'
        required: false
        default: ''
      preview_only:
        description: 'PREVIEW-ONLY = FULL-LENGTH review render (all frames, all segments; not a short clip). REVIEW findings recorded, BLOCK still stops. Not delivery-approved.'
        required: false
        default: ''
      assemble_manifest:
        description: 'CLOUD ASSEMBLY (scripts/render-github-cloud-assemble.js): seg:owner/repo:runId:start-end;… — when set, this run renders nothing; it joins + verifies those segments and uploads the final film.'
        required: false
        default: ''
      thumbnails:
        description: 'THUMBNAILS A/B/C (scripts/lib/cloud-thumbs.js): true + assemble_manifest = after the verified assembly, once per film (production finalization); true alone = THUMBNAIL-ONLY (no film rendered, joined or published).'
        required: false
        default: ''

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cloud assembly: only when a manifest is given. Least privilege: this run's own GITHUB_TOKEN, read-only; the
  # segment artifacts it reads live in the (public) worker repos. No PAT, no secret.
  assemble:
    name: Assemble + Verify (cloud)
    if: ${{ github.event.inputs.assemble_manifest != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # A long film plus its segments can exceed the runner's ~14 GB free disk; drop preinstalled toolchains.
      - name: Free disk + install FFmpeg
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip
          df -h /

      - name: Join + verify segments
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/render-cloud-assemble.js --slug="${{ github.event.inputs.slug }}" --manifest="${{ github.event.inputs.assemble_manifest }}" ${{ github.event.inputs.preview_only == 'true' && '--preview' || '' }}

      # the small report first, on its own: the dispatcher reads it without downloading the film
      - name: Upload verification report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ github.event.inputs.slug }}
          path: out/${{ github.event.inputs.slug }}.verify.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload final film
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.event.inputs.slug }}-final
          path: out/*.mp4
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

  # Thumbnails A/B/C: the same scripts/render-thumbnails.js (grammar, hook, hook-visibility check) on a runner.
  # Production finalization = after `assemble` succeeded, once per film (never in a segment run); THUMBNAIL-ONLY = this
  # job alone (no manifest) on a thumbnail bundle (code + books/<slug> + the assets the Thumb composition reads, no
  # narration audio). continue-on-error: a thumbnail failure never fails the run, so it never un-verifies a film.
  # Read-only token; the PNGs + thumbnail-check.json + record.json (sha256, inputs) go to the thumbs-<slug> artifact.
  thumbnails:
    name: Thumbnails A/B/C
    needs: assemble
    if: ${{ !cancelled() && github.event.inputs.thumbnails == 'true' && (github.event.inputs.assemble_manifest == '' || needs.assemble.result == 'success') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout the thumbnail bundle
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # bounded apt (render-stills.yml, cycle 17: apt hung for 10+ min on runners) — a hang must not eat the job's time
      - name: Install FFmpeg (hook-visibility check)
        timeout-minutes: 8
        run: |
          command -v ffmpeg >/dev/null && { ffmpeg -version | head -1; exit 0; }
          for i in 1 2 3; do
            if timeout 120 sudo apt-get update -qq && timeout 180 sudo apt-get install -y -qq ffmpeg; then exit 0; fi
            echo "apt attempt $i failed or hung - retrying"; sleep 5
          done
          exit 1

      - name: Install NPM Dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Books Registry
        run: node scripts/gen-books-registry.js

      - name: Render thumbnails A/B/C + hook check
        run: node scripts/render-thumbnails.js --slug="${{ github.event.inputs.slug }}" --pack="out/thumbs-${{ github.event.inputs.slug }}"

      - name: Upload thumbnails
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: thumbs-${{ github.event.inputs.slug }}
          path: out/thumbs-${{ github.event.inputs.slug }}/
          retention-days: 14
          if-no-files-found: warn

  render:
    name: Render Video
    if: ${{ github.event.inputs.assemble_manifest == '' && github.event.inputs.thumbnails != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install System Dependencies (FFmpeg & Chromium)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo apt-get install -y chromium-browser || true

      - name: Install NPM Dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Books Registry
        run: node scripts/gen-books-registry.js

      # Mastering is NOT optional. The bundle only ever ships the RAW audio
      # (*.mastered.m4a is gitignored), and render-bundle.js re-points meta.audio
      # at that raw file, so this step is what brings the -14 LUFS master into
      # existence and repoints the config at it. It used to end in
      # `|| echo "master-audio skipped"`, which meant a mastering failure was
      # swallowed and the render shipped the quiet raw audio - or, when the config
      # still named the mastered file, SILENCE. Either way the post-render ffprobe
      # check passed, because it verifies duration and decode, not loudness. Fail
      # loudly here instead: burning ~45 min of runner time on an unusable master
      # is far worse than stopping now.
      - name: Master audio
        run: node scripts/master-audio.js --slug="${{ github.event.inputs.slug }}" --update-config

      - name: Render Video (Local Chunking on Runner)
        run: |
          node scripts/render.js \
            --slug="${{ github.event.inputs.slug }}" \
            ${{ github.event.inputs.composition != '' && format('--composition="{0}"', github.event.inputs.composition) || '' }} \
            --method=local \
            --chunk-size=${{ github.event.inputs.chunk_size }} \
            --concurrency=${{ github.event.inputs.concurrency }} \
            ${{ github.event.inputs.frames != '' && format('--frames={0}', github.event.inputs.frames) || '' }} \
            ${{ github.event.inputs.skip_narrative_firewall != '' && '--skip-narrative-firewall' || '' }} \
            ${{ github.event.inputs.preview_only == 'true' && '--preview-only' || '' }}

      - name: Label segment output
        if: ${{ github.event.inputs.seg != '' }}
        run: mv "out/${{ github.event.inputs.slug }}.mp4" "out/${{ github.event.inputs.slug }}-seg${{ github.event.inputs.seg }}.mp4"

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.event.inputs.slug }}${{ github.event.inputs.seg != '' && format('-seg{0}', github.event.inputs.seg) || '' }}
          path: out/*.mp4
          retention-days: 14
          if-no-files-found: error

      # A single-job PRODUCTION render (whole film, no segment) makes its thumbnails on this same runner, AFTER the film
      # artifact is uploaded; a failure here never fails the job. Segment runs never do (once per film: the assembly run).
      - name: Render thumbnails A/B/C + hook check
        id: thumbs
        if: ${{ success() && github.event.inputs.seg == '' && github.event.inputs.frames == '' && github.event.inputs.preview_only != 'true' }}
        continue-on-error: true
        run: node scripts/render-thumbnails.js --slug="${{ github.event.inputs.slug }}" --pack="out/thumbs-${{ github.event.inputs.slug }}"

      - name: Upload thumbnails
        if: ${{ !cancelled() && steps.thumbs.outcome != 'skipped' && steps.thumbs.outcome != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: thumbs-${{ github.event.inputs.slug }}
          path: out/thumbs-${{ github.event.inputs.slug }}/
          retention-days: 14
          if-no-files-found: warn
